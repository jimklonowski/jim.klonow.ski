<!--
  jck:logo — the site mark, traced from public/icon-512.png (the PWA/homescreen icon): an afib
  strip, irregularly irregular, with the tall R spike falling straight into the deepest trough
  and no two intervals alike. The app icon's grid backdrop and glow are tile decoration and are
  deliberately not here; a nav mark is just the trace.

  Coordinates are the PNG's own, scaled 24/512. The stroke is deliberately finer than a literal
  scaling of the PNG's ~28px line (which works out at ≈1.3): the cluster's spikes are barely a
  unit apart, so anything heavier closes the gaps between them and the mark fills in as a blob
  at nav size.

  Drawn in currentColor rather than the accent hex so it inherits whatever it sits in — the
  favicon keeps its literal #2ce8a4 because a browser tab has nothing to inherit from.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.0" stroke-linecap="round" stroke-linejoin="round">
  <path d="M0.75 11.81H4.69L5.63 8.72L6.56 11.81H9.38L10.41 5.53L11.63 18.38L12.42 8.2L13.27 16.17L14.2 7.13L15.23 14.91L16.41 9.94L17.11 14.06L18.38 11.81H23.25" />
</svg>
