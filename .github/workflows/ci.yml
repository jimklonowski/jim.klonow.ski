name: ci

on: push

permissions:
  contents: read

# A newer push to the same branch supersedes the run in flight.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    strategy:
      fail-fast: false
      matrix:
        # The unit tests load shared/utils/*.ts through Node's native type stripping (22.18+),
        # so both maintained lines run: 22 is the CI floor from package.json engines, 24 is
        # what the dev machine runs.
        node: [22, 24]

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Install node
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install

      - name: Lint
        run: pnpm run lint

      - name: Typecheck
        run: pnpm run typecheck

      - name: Test
        run: pnpm test

      # The same build `pnpm deploy` runs, so a bundle break is caught here rather than during
      # a laptop deploy. No Cloudflare credentials are needed for the build itself.
      - name: Build
        run: pnpm run build
