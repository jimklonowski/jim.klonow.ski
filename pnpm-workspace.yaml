allowBuilds:
  '@parcel/watcher': true
  better-sqlite3: true
  esbuild: true
  sharp: true
  unrs-resolver: true
  vue-demi: true
  workerd: true

# Force a single Vue version across the tree. Without this, transitive deps resolved
# multiple Vue patch releases (3.5.38/39/40) side by side, which made Nuxt UI's ULink /
# vue-router `custom` slot receive undefined props during production SSR — crashing every
# page with a header/link on hard reload ("Cannot destructure property 'href' of undefined").
# The version lives once, in the catalog below: package.json's vue is `catalog:`, and the
# overrides reuse the same value through the YAML anchor, so bumping that one line moves the
# whole tree. These used to be literal versions and drifted (vue 3.5.43 over @vue/* 3.5.41,
# plus a stray vue 3.5.42 copy).
catalog:
  vue: &vue 3.5.44

overrides:
  # Nuxt UI declares its ~20 @tiptap/* peers as required, so pnpm auto-installs them (this app
  # never renders an editor). They were pinned at 3.26.1 when first added, but extension-list is
  # a plain dependency of starter-kit and floated to 3.31, and tiptap's peers are exact pins.
  # Nuxt 4.5 never pre-bundled tiptap; Nuxt 4.6's eager Vite optimizer does, and the mismatch
  # ("getPreviousBlockSibling is not exported by @tiptap/core") crashes the optimizer so that
  # `nuxt dev` server-renders but never hydrates. Holding extension-list at the rest of the
  # tree's version is the one-line fix; dedupe/update can't reach auto-installed peers.
  '@tiptap/extension-list': 3.26.1
  tslib: 2.8.1
  vue: *vue
  '@vue/shared': *vue
  '@vue/reactivity': *vue
  '@vue/runtime-core': *vue
  '@vue/runtime-dom': *vue
  '@vue/server-renderer': *vue
  '@vue/compiler-core': *vue
  '@vue/compiler-dom': *vue
  '@vue/compiler-sfc': *vue
  '@vue/compiler-ssr': *vue
